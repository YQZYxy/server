// 字段必须加 optional 关键字 
// 结构命名加 PB_ 
// 协议命名加 P_
syntax = "proto3";

import "data.proto";
import "roledata.proto";

// =============================跨服数据结构========================================

// 进场票据, 归属服下发给客户端用于连接跨服
message PB_CrossTicket
{
	optional uint64 role_uid		= 1;	// 角色uid
	optional uint32 home_server_id	= 2;	// 数据归属服id
	optional uint32 scene_server_id	= 3;	// 跨服id
	optional uint64 expire_time		= 4;	// 票据过期时间
	optional int32 cross_type		= 5;	// 跨服类型, 见 CROSS_TYPE_*
	optional string scene_ip		= 6;	// 跨服网关对外ip
	optional uint32 scene_port		= 7;	// 跨服网关对外端口
	optional string token			= 8;	// 客户端进场令牌
}

// =============================跨服集群消息========================================

// 跨服角色数据
message PB_CrossRoleData
{
	optional int64 role_uid			= 1;	// 角色uid
	optional uint32 home_server_id	= 2;	// 数据归属服id(合服后已归一到主服)
	optional PB_RoleData role_data	= 3;	// 完整角色数据
}

// 归属服 -> 跨服: 进场申请
// 使用 CLUSTER_CHANNEL_CROSS 通道, body_type 为 CROSS_MSG_ENTER_APPLY
// 跨服只持有这份只读副本, 任何持久化修改都必须回传归属服
message P_CrossEnterApply
{
	optional PB_CrossRoleData role	= 1;	// 角色数据
	optional uint32 activity_id		= 2;	// 关联活动id, 决定跨服场景
	optional PB_Vector3 pos			= 3;	// 进场实时坐标
}

// 跨服 -> 归属服: 结算回传
// 使用 CLUSTER_CHANNEL_CROSS 通道, body_type 为 CROSS_MSG_SETTLE
message P_CrossSettle
{
	optional PB_CrossRoleData role	= 1;	// 跨服上的最新角色数据
	optional uint32 activity_id		= 2;	// 关联活动id
}

// 归属服 -> 跨服: 离场
// 使用 CLUSTER_CHANNEL_CROSS 通道, body_type 为 CROSS_MSG_LEAVE
message P_CrossLeave
{
	optional int64 role_uid	= 1;	// 角色uid
}

// 任意节点 -> 归属服: 查询角色数据
// 使用 CLUSTER_CHANNEL_CROSS 通道, body_type 为 CROSS_MSG_QUERY_ROLE
message P_CrossQueryRole
{
	optional int64 role_uid	= 1;	// 角色uid
}

// 归属服 -> 发起查询的节点: 查询角色数据应答
message P_CrossQueryRoleRet
{
	optional PB_CrossRoleData role	= 1;	// 角色数据
}
