// 字段必须加 optional 关键字 
syntax = "proto3";

import "data.proto";

// ==================== 角色基础数据 ====================

message PB_RoleBaseInfo
{
	optional int64 uid				= 1;
	optional string name 			= 2;	
	optional string user_name		= 3;
	optional int32 level			= 4;	// 角色等级
	optional int64 exp				= 5;	// 角色经验
	optional int64 last_login_time	= 6;	// 最后登录时间
	optional int32 knapsack_max_slots	= 7;	// 背包最大槽位数
	optional int64 create_time		= 8;	// 创角时间
	optional int32 hero_id			= 9;	// 当前MMO出战英雄id, 0表示未绑定
}

// ==================== 活动个人数据 ====================

// 单个活动的角色数据
message PB_ActivityRoleNode
{
	optional uint32 activity_id			= 1;	// 活动id, 与 ACTIVITY_ID 枚举一致
	optional int32 round				= 2;	// 已参与的轮次
	optional int32 count				= 3;	// 累计参与次数
	optional int32 score				= 4;	// 积分或进度
	optional int64 last_time			= 5;	// 最后参与时间
	optional bool rewarded				= 6;	// 是否已领奖
	optional string extra				= 7;	// 业务扩展(序列化后的Lua数据)
}

// 角色活动数据
message PB_ActivityRoleData
{
	repeated PB_ActivityRoleNode nodes	= 1;
}

// ==================== 养成模块数据 ====================

message PB_RoleGrowthData
{
	optional PB_HeroListData hero			= 1;	// 英雄
	optional PB_LineupListData lineup		= 2;	// 阵容
	optional PB_TaskData task				= 3;	// 任务
	optional PB_ActivityRoleData activity	= 4;	// 活动个人数据
}

// ==================== 角色数据 ====================

message PB_RoleData
 {
	optional PB_RoleBaseInfo base_info = 1;		// 角色基础信息
	optional PB_KnapsackData knapsack = 2;		// 背包数据
	optional PB_RoleGrowthData growth = 3;		// 养成模块
	optional PB_ScenePos mmo = 4;				// MMO 最后所在场景与坐标
}
