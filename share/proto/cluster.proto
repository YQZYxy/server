// 字段必须加 optional 关键字 
// 结构命名加 PB_ 
// 协议命名加 P_
syntax = "proto3";

// =============================集群系统消息========================================

// 集群握手
// 使用 CLUSTER_CHANNEL_SYSTEM 通道, body_type 为 CLUSTER_SYS_HELLO / CLUSTER_SYS_HELLO_ACK
message P_ClusterHello
{
	optional string token	= 1;	// 握手令牌, 空表示不校验
}

// 集群心跳
// 使用 CLUSTER_CHANNEL_SYSTEM 通道, body_type 为 CLUSTER_SYS_HEARTBEAT
message P_ClusterHeartbeat
{
	optional int32 load	= 1;	// 节点负载
}

// 节点表中的单个节点
message P_ClusterNodeInfo
{
	optional uint32 zone_id		= 1;	// 分区id
	optional uint32 server_id	= 2;	// 服务器id
	optional int32 node_type	= 3;	// 节点类型, 见 PLUGIN_NODE_TYPE_*
	optional uint32 instance_id	= 4;	// 同类型节点实例id
	optional int32 load			= 5;	// 节点负载
	optional bool online		= 6;	// 是否在线
}

// 节点表同步
// 使用 CLUSTER_FRAME_TYPE_NODE_LIST 帧, 收到后合并进本机路由表
// 星型拓扑下叶子节点只能直连中心节点, 靠这张表才知道其它节点的存在
message P_ClusterNodeList
{
	repeated P_ClusterNodeInfo nodes = 1;	// 已知节点
}

// =============================集群RPC应答========================================

// 集群RPC应答信封, 业务包体统一放在 body
// 应答帧的 body_type 与请求一致, body 为具体业务协议的序列化结果
message P_ClusterRpcReply
{
	optional int32 error_code		= 1;	// 错误码, 0表示成功, 见 CLUSTER_ERROR_*
	optional string error_message	= 2;	// 错误描述, 成功时为空
	optional bytes body				= 3;	// 业务包体, 业务协议的序列化结果
}
