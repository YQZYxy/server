// 字段必须加 optional 关键字 
syntax = "proto3";

// ==================== 通用协议结构 ====================

// 消息头
message PB_MessageHead
{
	optional int32 msg_type					= 1;	// 消息类型
	repeated int32 param					= 2;	// 扩展参数
	optional string token					= 3;	// 外部访问令牌
}

// ==================== 通用位置结构 ====================

// 三维坐标
message PB_Vector3
{
	optional float x						= 1;	// 坐标x
	optional float y						= 2;	// 坐标y
	optional float z						= 3;	// 坐标z
}

// 场景内位置: 场景id + 坐标
message PB_ScenePos
{
	optional uint64 scene_id				= 1;	// 场景id
	optional PB_Vector3 pos					= 2;	// 场景内坐标
}


// 活动开关存库状态
message PB_ActivityState
{
	optional int32 server_id			= 1;	// 逻辑服id
	optional uint32 config_id			= 2;	// 配置行id
	optional uint32 activity_id			= 3;	// 业务活动id
	optional int32 state				= 4;	// 活动状态
	optional int64 state_begin_time		= 5;	// 当前状态开始时间
	optional int64 start_time			= 6;	// 本轮开始时间
	optional int64 end_time				= 7;	// 本轮结束时间
	optional int32 round				= 8;	// 轮次
	optional int64 last_window_end		= 9;	// 已处理过的一次性窗口结束时间
	optional int64 update_time			= 10;	// 最后更新时间
}

message PB_ServerGlobalData
{
	optional int64 server_begin_timestamp 		= 1;
	optional int64 next_month_timestamp			= 2;
	optional int64 next_week_timestamp			= 3;
	optional int64 last_update_dayid			= 4;
}

// ==================== 聊天数据 ====================

message PB_ChatData			
{
	optional uint64 chat_id			= 1;
	optional string chat_msg		= 2;
	optional string user_name	= 3;
	optional string name			= 4;
	optional int64 uid			= 5;
	optional uint64 time			= 6;
}

// ==================== 背包协议数据 ====================

// 通用物品(槽位与非槽位列表共用, 非槽位场景 slot_index 为 0)
message PB_Item
{
	optional int32 slot_index		= 1;	// 槽位索引
	optional int32 item_id			= 2;	// 道具id
	optional int64 num				= 3;	// 数量
	map<string, int32> stat_tags	= 4;	// 道具标签
}

message PB_KnapsackData
{
	repeated PB_Item slots					= 1;	// 已使用的槽位列表
}

// ==================== 属性协议数据 ====================

message PB_AttrPair
{
	optional int32 attr_id			= 1;	// 属性id
	optional double value			= 2;	// 属性值
}

message PB_AttrData
{
	repeated PB_AttrPair attrs		= 1;	// 属性列表
}

// ==================== 技能协议数据 ====================

message PB_AbilitiesData
{
	repeated int32 ability_ids		= 1;	// 已学习能力id列表
}

// ==================== 任务协议数据 ====================

message PB_TaskObjectiveData
{
	optional int32 current_count	= 1;	// 当前进度计数
	optional bool completed			= 2;	// 是否已完成
}

message PB_TaskSaveData
{
	optional int32 status						= 1;	// 任务状态
	optional int64 start_time					= 2;	// 开始时间戳
	optional int64 complete_time				= 3;	// 完成时间戳
	repeated PB_TaskObjectiveData objectives	= 4;	// 子目标进度列表
}

message PB_TaskData
{
	optional int32 max_active							= 1;	// 最大活跃任务数
	map<int32, PB_TaskSaveData> active_tasks			= 2;	// 活跃任务列表
	repeated int32 completed_tasks						= 3;	// 已完成任务id列表
}

// ==================== 英雄协议数据 ====================

message PB_HeroData
{
	optional int32 hero_id			= 1;	// 英雄id(原role_id)
	optional int32 level			= 2;	// 英雄等级
	optional int64 exp				= 3;	// 英雄经验
	optional PB_AbilitiesData abilities	= 4;	// 已学习能力
	optional PB_AttrData attrs			= 5;	// 属性数据
	optional int64 combat_power		= 6;	// 战力(服务器计算)
}

message PB_HeroListData
{
	repeated PB_HeroData heroes		= 1;	// 英雄列表
}

// ==================== 阵容协议数据 ====================

message PB_LineupData
{
	optional int32 battle_type		= 1;	// 战斗类型
	repeated int32 hero_ids			= 2;	// 上阵英雄id列表(不可重复,上限5个)
	optional int64 combat_power		= 3;	// 阵容总战力
	optional int32 slot				= 4;	// 阵容槽位(0=默认阵容,多阵容场景从0递增)
}

message PB_LineupListData
{
	repeated PB_LineupData lineups	= 1;	// 阵容列表
}

// ==================== 排行榜节点 ====================

message PB_RankNode
{
	optional int32 rank						= 1;	// 排名
	optional int64 uid						= 2;	// 用户uid
	optional string name					= 3;	// 名字
	optional int64 value					= 4;	// 排行榜主值
	optional int64 param1					= 5;	// 自定义排序参数1
	optional int64 param2					= 6;	// 自定义排序参数2
	optional int64 param3					= 7;	// 自定义排序参数3
	optional int64 update_time				= 8;	// 更新时间戳(毫秒)
	optional int64 power					= 9;	// 阵容战力
	repeated PB_HeroData heroes				= 10;	// 阵容英雄
}

message PB_ArenaRankNode
{
	optional PB_RankNode base					= 1;	
}

// lua全局数据节点, 通用键值存储, 内容由业务自定义
message PB_GlobalDataDbNode
{
	optional string key						= 1;	// 数据键
	optional string data					= 2;	// 序列化后的lua数据
}

// 聊天数据映射, 按频道打包多条聊天
message PB_InnerChatMap
{
	map<int64, PB_ChatData> chats			= 1;	// chat_id -> 聊天内容
}


